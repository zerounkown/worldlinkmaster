name: E2E Tests

# Gated to PRs targeting main only — a browser suite hitting a real Stripe test-mode API and
# downloading Playwright's browser binary is slower/costlier than the unit/integration suite in
# tests.yml, so it runs as a pre-merge gate rather than on every push to every branch.
on:
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    uses: ./.github/workflows/_e2e-tests.yml
    secrets: inherit
